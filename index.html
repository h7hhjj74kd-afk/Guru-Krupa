<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Guru Krupa — Raval Ranchhod">
  <title>Guru Krupa | Raval Ranchhod</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --gold: #d9a441;
      --gold-light: #f4d27a;
      --black: #050505;
      --soft-black: #0b0b0b;
      --white: #f7f5ef;
      --muted: #9c9a94;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--black);
      color: var(--white);
    }

    body {
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      isolation: isolate;
      background:
        radial-gradient(circle at 50% 38%, rgba(217,164,65,.13), transparent 34%),
        radial-gradient(circle at 15% 85%, rgba(217,164,65,.055), transparent 28%),
        linear-gradient(145deg, #030303 0%, #0a0a0a 48%, #020202 100%);
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: .18;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 70px 70px;
      mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
    }

    .corner {
      position: absolute;
      width: 170px;
      height: 170px;
      pointer-events: none;
      opacity: .55;
    }

    .corner::before,
    .corner::after {
      content: "";
      position: absolute;
      background: linear-gradient(90deg, transparent, var(--gold));
    }

    .corner.top-left {
      top: 28px;
      left: 28px;
    }

    .corner.top-left::before {
      top: 0;
      left: 0;
      width: 120px;
      height: 1px;
    }

    .corner.top-left::after {
      top: 0;
      left: 0;
      width: 1px;
      height: 120px;
      background: linear-gradient(180deg, var(--gold), transparent);
    }

    .corner.bottom-right {
      right: 28px;
      bottom: 28px;
      transform: rotate(180deg);
    }

    .corner.bottom-right::before {
      top: 0;
      left: 0;
      width: 120px;
      height: 1px;
    }

    .corner.bottom-right::after {
      top: 0;
      left: 0;
      width: 1px;
      height: 120px;
      background: linear-gradient(180deg, var(--gold), transparent);
    }

    .content {
      width: min(900px, 90%);
      text-align: center;
      padding: 70px 20px;
    }

    .eyebrow {
      color: var(--gold);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .42em;
      text-transform: uppercase;
      margin-bottom: 25px;
      opacity: .9;
    }

    .title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(76px, 13vw, 175px);
      line-height: .82;
      letter-spacing: -.055em;
      font-weight: 700;
      text-transform: uppercase;
      background: linear-gradient(
        105deg,
        #b47a20 0%,
        #f7d67e 28%,
        #fff0ad 48%,
        #c58a29 72%,
        #f1c967 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 45px rgba(217,164,65,.13);
    }

    .subtitle {
      margin-top: 29px;
      display: inline-flex;
      align-items: center;
      gap: 17px;
      color: var(--white);
      font-size: clamp(12px, 1.7vw, 17px);
      font-weight: 600;
      letter-spacing: .52em;
      text-transform: uppercase;
      padding-left: .52em;
    }

    .subtitle::before,
    .subtitle::after {
      content: "";
      width: 48px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold));
    }

    .subtitle::after {
      background: linear-gradient(90deg, var(--gold), transparent);
    }

    .links {
      margin: 58px auto 0;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      position: relative;
    }

    .link {
      min-width: 155px;
      height: 52px;
      padding: 0 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px solid rgba(217,164,65,.5);
      border-radius: 2px;
      color: var(--white);
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      background: rgba(255,255,255,.025);
      transition: .3s ease;
      backdrop-filter: blur(8px);
      cursor: pointer;
      font-family: inherit;
    }

    .link span {
      color: var(--gold-light);
      font-size: 15px;
    }

    .link:hover,
    .link.active {
      color: #080808;
      background: var(--gold-light);
      border-color: var(--gold-light);
      transform: translateY(-3px);
      box-shadow: 0 12px 35px rgba(217,164,65,.18);
    }

    .link:hover span,
    .link.active span {
      color: #080808;
    }

    /* Contact Dropdown Styles */
    .contact-wrapper {
      position: relative;
      display: inline-block;
    }

    .contact-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 12px);
      left: 50%;
      transform: translateX(-50%);
      background: #0f0f0f;
      border: 1px solid rgba(217,164,65,.6);
      border-radius: 4px;
      padding: 8px;
      min-width: 180px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      z-index: 50;
      flex-direction: column;
      gap: 6px;
    }

    .contact-dropdown.open {
      display: flex;
    }

    .contact-dropdown-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 14px;
      color: var(--white);
      text-decoration: none;
      font-size: 13px;
      letter-spacing: .08em;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid transparent;
      border-radius: 2px;
      transition: .2s ease;
    }

    .contact-dropdown-item:hover {
      background: rgba(217,164,65,.15);
      border-color: var(--gold);
      color: var(--gold-light);
    }

    .line {
      width: min(500px, 70%);
      height: 1px;
      margin: 62px auto 0;
      background: linear-gradient(90deg, transparent, rgba(217,164,65,.55), transparent);
    }

    .bottom {
      margin-top: 20px;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .28em;
      text-transform: uppercase;
    }

    @media (max-width: 600px) {
      .corner {
        width: 100px;
        height: 100px;
      }

      .corner.top-left,
      .corner.bottom-right {
        top: 18px;
        left: 18px;
        right: auto;
        bottom: auto;
      }

      .corner.bottom-right {
        left: auto;
        right: 18px;
        top: auto;
        bottom: 18px;
      }

      .corner.top-left::before,
      .corner.bottom-right::before {
        width: 70px;
      }

      .corner.top-left::after,
      .corner.bottom-right::after {
        height: 70px;
      }

      .content {
        padding: 40px 10px;
      }

      .eyebrow {
        font-size: 8px;
        letter-spacing: .3em;
      }

      .title {
        font-size: clamp(58px, 18vw, 100px);
      }

      .subtitle {
        font-size: 10px;
        letter-spacing: .34em;
        gap: 9px;
      }

      .subtitle::before,
      .subtitle::after {
        width: 24px;
      }

      .links {
        margin-top: 42px;
        gap: 10px;
      }

      .contact-wrapper {
        width: min(300px, 90vw);
      }

      .link {
        width: min(300px, 90vw);
        height: 48px;
      }

      .contact-dropdown {
        width: 100%;
      }

      .line {
        margin-top: 45px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="corner top-left"></div>
    <div class="corner bottom-right"></div>

    <section class="content">
      <div class="eyebrow">Body &amp; Work Station</div>

      <h1 class="title">Guru Krupa</h1>

      <div class="subtitle">Raval Ranchhod</div>

      <nav class="links" aria-label="Contact links">
        
        <!-- Single Contact Button with Popover -->
        <div class="contact-wrapper">
          <button class="link" id="contactToggle" aria-haspopup="true" aria-expanded="false" type="button">
            <span>✆</span> Contact
          </button>
          <div class="contact-dropdown" id="contactMenu">
            <a class="contact-dropdown-item" href="tel:+916354714783">
              <span>✆</span> 63547 14783
            </a>
            <a class="contact-dropdown-item" href="tel:+919265108548">
              <span>✆</span> 92651 08548
            </a>
          </div>
        </div>

        <a class="link" href="https://www.instagram.com/gurukrupa_carbody_melusan?stkn=cWtjMnpsNWwzdjFi" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
          <span>◎</span> Instagram
        </a>

        <a class="link" href="https://wa.me/919265108548" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">
          <span>◉</span> WhatsApp
        </a>
      </nav>

      <div class="line"></div>
      <div class="bottom">Guru Krupa · Raval Ranchhod</div>
    </section>
  </main>

  <script>
    const contactToggle = document.getElementById('contactToggle');
    const contactMenu = document.getElementById('contactMenu');

    contactToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = contactMenu.classList.toggle('open');
      contactToggle.classList.toggle('active', isOpen);
      contactToggle.setAttribute('aria-expanded', isOpen);
    });

    // Close the dropdown when clicking anywhere outside
    document.addEventListener('click', (e) => {
      if (!contactMenu.contains(e.target) && !contactToggle.contains(e.target)) {
        contactMenu.classList.remove('open');
        contactToggle.classList.remove('active');
        contactToggle.setAttribute('aria-expanded', 'false');
      }
    });
  </script>
</body>
</html>
